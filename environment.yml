# Conda environment file for Wenuray, radio-interferometric self-calibration
#
# To create this environment:
#   conda env create -f environment.yml
#
# To update this environment:
#   conda env update -f environment.yml --prune
#
# To activate this environment:
#   conda activate wenuray-env

name: wenuray-env

channels:
- conda-forge

dependencies:
  # requirements.txt pins the Python 3.12 casatools wheel; Wenuray supports 3.11-3.13 (#99)
- python=3.12
- pip
  # CASA and the other dependencies come from PyPI, pinned to the set tested in CI
- pip:
  - -r requirements.txt
