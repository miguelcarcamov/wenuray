# Pyralysis's environment for Wenuray on a Kepler GPU (compute capability 3.5 and 3.7: Tesla K40,
# K80), which CUDA 12 dropped. Kepler's last driver series, R470, runs CUDA 11.4 at most, so the
# toolkit is pinned to it; CuPy 14 dropped CUDA 11, hence CuPy 13. Numba's CUDA target no longer
# supports CUDA 11, so Pyralysis's GPU work runs through CuPy only. Which file suits your card:
# envs/README.md.
#
# CUDA's toolkit and CuPy come from conda-forge into the environment, which shadows a system CUDA
# while it is active (unset CUDA_PATH if the shell exports one). Don't also pip install a cupy-*
# wheel or Pyralysis's cupy extras on top.
#
# Create:  micromamba create -f envs/pyralysis-cuda11.yml   (or conda/mamba env create -f ...)
# Use:     export WENURAY_PYRALYSIS_PYTHON=$(micromamba run -n wenuray-pyralysis-cuda11 which python)
#
# Paths in the pip block are relative to this file.
name: wenuray-pyralysis-cuda11

channels:
- conda-forge

dependencies:
  # The interpreter and NumPy of requirements-pyralysis.txt's pins, so pip installs one NumPy only
- python=3.12
- numpy=2.3.5
- pip
- cudatoolkit=11.4
  # 13.3 is the first CuPy 13 with NumPy 2
- cupy>=13.3,<14
- pip:
  # ska-ost-array-config and the ska-* packages come from SKA's index
  - --extra-index-url https://artefact.skao.int/repository/pypi-internal/simple
  - -r ../requirements-pyralysis.txt
