# Tests Wenuray on every supported Python version (#99). CI runs these environments as a matrix.
#
#   tox -e py311,py312,py313     the wheel with freely resolved dependencies, as pip install wenuray
#   tox -e pinned                Python 3.12 with requirements.txt, the set the images and conda use
#   tox -e py312-pyralysis       the Pyralysis backend tests (any of py311/py312/py313)
#   tox -e py313 -- tests/unit   arguments after -- replace the test paths
#
# CASA reads its measures data from ~/.casa/data (CONTRIBUTING.md), so the CASA tests need it there.
[tox]
requires = tox>=4.11
env_list = py{311,312,313}, pinned, py{311,312,313}-pyralysis

[testenv]
package = wheel
wheel_build_env = .pkg
extras =
    test
    pyralysis: pyralysis
set_env =
    # Pyralysis's ska-ost-array-config is published on SKA's index only
    pyralysis: PIP_EXTRA_INDEX_URL = https://artefact.skao.int/repository/pypi-internal/simple
pass_env =
    NUMBA_*
deps =
    # pip picks casatools' manylinux_2_34 wheel for Python 3.12, which fails to import on
    # Debian/Ubuntu/Arch (OPENSSL_3.0.1 not found); the manylinux_2_28 wheel works (README)
    py312: casatools @ https://files.pythonhosted.org/packages/e3/fe/29ffbf125acd6ae63f4465ba59878627fd41221fce2ab369748d5df9a190/casatools-6.7.6.14-cp312-cp312-manylinux_2_28_x86_64.whl#sha256=f6db5ec590fb988799a614a0143391d4987d2c0650235b56fbedbdac33295e18
commands =
    python -c "import wenuray, casatools; print('wenuray', wenuray.__version__, 'casatools', casatools.version_string())"
    wenuray --version
    !pyralysis: pytest {posargs:tests -q}
    pyralysis: pytest {posargs:tests/integration/test_pyralysis_casa.py tests/integration/test_selfcal_recovers_gains_casa.py tests/unit/imaging/test_pyralysis_backend.py tests/unit/imaging/test_pyralysis_worker.py -q}

[testenv:pinned]
base_python = python3.12
deps = -r requirements.txt
