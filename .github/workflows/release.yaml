# Publishes Wenuray when a GitHub release is published: pre-releases go to TestPyPI, releases to
# PyPI. The package is built once and the same files are uploaded.
#
# Uploads use trusted publishing (OIDC), so no API token is stored. Each index needs a trusted
# publisher for this repository, workflow "release.yaml" and the environment named below:
# https://docs.pypi.org/trusted-publishers/adding-a-publisher/
name: release

on:
  release:
    types: [published]  # also fired for pre-releases

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # setuptools-scm derives the version from the tags
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        python -m build
        twine check --strict dist/*
    - name: Check the version matches the release tag
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        ls dist/
        ls dist/*-"${TAG#v}"-*.whl
    - uses: actions/upload-artifact@v4
      with:
        name: python-package
        path: dist/

  testpypi:
    if: github.event.release.prerelease
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/wenuray
    permissions:
      id-token: write  # trusted publishing
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: python-package
        path: dist/
    - name: Publish to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

  pypi:
    if: ${{ !github.event.release.prerelease }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wenuray
    permissions:
      id-token: write  # trusted publishing
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: python-package
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
