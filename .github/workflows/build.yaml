name: build

on:
  push:
    branches: [development]
  pull_request:
    branches:
    - development
    - master

# Superseded pull request runs are cancelled; pushes always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: '3.12'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install yapf
      run: |
        python -m pip install --upgrade pip
        pip install yapf==0.43.0  # same version as .pre-commit-config.yaml
    - name: Run yapf
      run: |
        yapf --recursive --verbose --diff .

  # Every pull request into development adds a news fragment to changes/ for CHANGELOG.md, unless it
  # is labelled no-changelog or comes from Dependabot
  changelog:
    if: >-
      github.event_name == 'pull_request' && github.base_ref == 'development'
      && github.actor != 'dependabot[bot]'
      && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Check for a news fragment
      run: |
        pip install towncrier==25.8.0
        towncrier check --compare-with origin/${{ github.base_ref }}

  # The documentation must build without warnings. autoapi reads the source, so neither Wenuray nor
  # CASA is installed
  docs:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # setuptools-scm gives the documented version
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: pip
        cache-dependency-path: docs/requirements.txt
    - name: Build the documentation
      run: |
        python -m pip install --upgrade pip
        pip install -r docs/requirements.txt
        sphinx-build -W --keep-going -b html docs docs/_build/html
    - name: Upload the documentation
      uses: actions/upload-artifact@v7
      with:
        name: wenuray-docs
        path: docs/_build/html

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # setuptools-scm derives the version from the tags
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        python -m build
        twine check --strict dist/*
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: wenuray-artifacts
        path: dist/*

  # tox runs the tests against the built wheel (#99):
  # - py311, py312 and py313 resolve the dependencies freely, as pip install wenuray does;
  # - pinned is Python 3.12 with requirements.txt, the set the images and conda install;
  # - the -pyralysis environments add the Pyralysis extra (3.2.1 or later, #80). Its
  #   ska-ost-array-config dependency comes from SKA's index, which tox.ini sets.
  test:
    name: test (${{ matrix.env }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
        - {env: py311, python: '3.11'}
        - {env: py312, python: '3.12'}
        - {env: py313, python: '3.13'}
        - {env: pinned, python: '3.12'}
        - {env: py311-pyralysis, python: '3.11'}
        - {env: py312-pyralysis, python: '3.12'}
        - {env: py313-pyralysis, python: '3.13'}
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - uses: actions/download-artifact@v8
      with:
        name: wenuray-artifacts
        path: dist/
    # CASA reads its measures data when casatools is imported. As in the Docker image, only the
    # measures and CASA's observatory table are fetched (not the ~1 GB casarundata), once a day at
    # most.
    - name: Date for the CASA data cache
      id: date
      run: echo "today=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
    - name: Cache CASA data
      id: casa-data
      uses: actions/cache@v6
      with:
        path: ~/.casa/data
        key: casa-data-${{ steps.date.outputs.today }}
        restore-keys: casa-data-
    - name: Fetch CASA measures data
      if: steps.casa-data.outputs.cache-hit != 'true'
      run: |
        # The packages are installed by tox later, so the script's own imports come first (#109)
        python -m pip install $(grep -E '^(casaconfig|certifi)==' requirements.txt)
        mkdir -p ~/.casa/data
        # A slow or failing server is fine if an earlier day's copy was restored from the cache,
        # but it is reported: the tests then run on older measures
        if ! python tools/fetch_casa_data.py ~/.casa/data; then
          test -d ~/.casa/data/geodetic/Observatories
          echo "::warning::CASA data fetch failed; using the copy restored from the cache"
        fi
    - name: Turn CASA data auto updates off
      run: |
        mkdir -p ~/.casa
        printf '%s\n' 'measures_auto_update = False' 'data_auto_update = False' > ~/.casa/config.py
    - name: Run tox
      run: |
        python -m pip install --upgrade pip tox
        tox -e ${{ matrix.env }} --installpkg "$(ls dist/*.whl)"
