name: build-base-container

on:
  push:
    branches:
    - development
    paths:
    - .github/workflows/build_base_container.yaml
    - Dockerfile
    - requirements.txt
  pull_request:
    branches:
    - development
    - master
    paths:
    - .github/workflows/build_base_container.yaml
    - Dockerfile
    - requirements.txt
  workflow_dispatch:

# Superseded pull request runs are cancelled; pushes always finish so the published image is complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    # Pull requests only build the image; it is pushed after review, from development.
    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.REGISTRY }}/${{ github.repository }}:base
          ${{ env.REGISTRY }}/${{ github.repository }}:base-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
