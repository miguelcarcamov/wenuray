name: build-base-container

on:
  push:
    branches:
    - development
    paths:
    - .github/workflows/build_base_container.yaml
    - Dockerfile
    - requirements.txt
    - requirements-pyralysis.txt
    - requirements-pyralysis-gpu.txt
  pull_request:
    branches:
    - development
    - master
    paths:
    - .github/workflows/build_base_container.yaml
    - Dockerfile
    - requirements.txt
    - requirements-pyralysis.txt
    - requirements-pyralysis-gpu.txt
  workflow_dispatch:

# Superseded pull request runs are cancelled; pushes always finish so the published image is complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # :base has Pyralysis on CPU; :base-gpu adds CUDA 12 for it (#148)
    strategy:
      fail-fast: false
      matrix:
        include:
        - {tag: base, pyralysis: pyralysis}
        - {tag: base-gpu, pyralysis: pyralysis-gpu}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
    - name: Free up disk space
      if: matrix.pyralysis == 'pyralysis-gpu'
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY"
        df -h
    # Pull requests only build the image; it is pushed after review, from development.
    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        build-args: PYRALYSIS=${{ matrix.pyralysis }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ env.REGISTRY }}/${{ github.repository }}:${{ matrix.tag }}
          ${{ env.REGISTRY }}/${{ github.repository }}:${{ matrix.tag }}-${{ github.sha }}
        cache-from: type=gha,scope=${{ matrix.tag }}
        cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
