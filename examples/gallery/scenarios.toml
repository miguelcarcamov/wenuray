# The gallery's scenarios (docs/gallery.md): two arrays (VLA, ALMA) at a low and a high frequency in
# a compact and an extended configuration, and MeerKAT below 1 GHz, each observing a target typical
# for it (skies.py). make_gallery.py simulates, self-calibrates and draws each one.
#
# Each target is sized in units of a few resolutions (lambda / the longest baseline), and shrunk
# when it would be larger than the array images (about 0.6 lambda / the shortest baseline),
# and its fluxes are in units of the image's thermal noise, so the scenarios have comparable S/N.
#
# The gain errors follow the physics. They drift smoothly over a coherence time (minutes, shorter at
# high frequency and on long baselines, where the turbulence crossing the array changes faster), as
# the atmosphere's do (DriftingGainInjector in pyralysis_simulation.py; pyralysis#409):
# - the ionosphere's phase grows towards low frequency (as 1/nu) and with baseline length;
# - the troposphere's grows with frequency (as nu, after water-vapour correction at ALMA) and with
# baseline length (as the phase structure function, about B^0.5, up to its outer scale);
# - amplitude errors grow with frequency (pointing and opacity).
# The values are this gallery's, chosen to be typical, not measured.

[[scenario]]
name = "meerkat-uhf"
sky = "giant_radio_galaxy"
about = "a giant radio galaxy and field sources"
title = "MeerKAT"
subtitle = "816 MHz · up to 8 km"
configuration = "meerkat.cfg"
frequency = 816e6
bandwidth = 0.5e9
system_temperature = 25.0
phase_error = 25.0  # ionosphere at UHF over 8 km
amplitude_error = 0.02
declination = "-30d00m00s"
seed = 101
coherence_time = 600.0

